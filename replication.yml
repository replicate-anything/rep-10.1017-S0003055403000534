paper:
  doi: https://doi.org/10.1017/S0003055403000534
  article_url: https://www.cambridge.org/core/journals/american-political-science-review/article/abs/ethnicity-insurgency-and-civil-war/B1D5D0E7C782483C5D7E102A61AD6605
  title: Ethnicity, Insurgency, and Civil War
  journal: American Political Science Review
  year: 2003
  authors: James Fearon, David Laitin
  dependencies:
    - haven
    - modelsummary
    - kableExtra

maintainer:
  name: Macartan Humphreys
  email: macartan.humphreys@wzb.eu

collections:
  - APSR

repo: replicate-anything/rep-10.1017-S0003055403000534

languages:
  - r
  - stata

steps:
  - id: analysis_data
    type: transform
    label: Analysis data
    description: Rename lpopl1 and recode onset indicators for analysis
    parents: []
    inputs:
      - data/repdata.dta
    outputs:
      - outputs/analysis_data.rds
      - outputs/analysis_data.dta
    engine: r
    code: code/steps/analysis_data.R
    data: data/repdata.dta
    dependencies:
      - haven

  - id: tab_1
    group: tab_1
    type: table
    label: Table 1
    description: Logit analyses of determinants of civil war onset, 1945–99
    parents:
      - analysis_data
    engine: r
    inputs:
      - outputs/analysis_data.rds
    data: outputs/analysis_data.rds
    code: code/tab_1.R
    format: format_tab_1
    outputs:
      - outputs/tab_1.html
    artifact: outputs/tab_1.html
    dependencies:
      - haven
      - modelsummary
      - kableExtra

  - id: tab_1_format
    type: format
    label: Table 1 format
    parent: tab_1
    code: code/tab_1.R

  - id: tab_1_stata
    group: tab_1
    type: table
    label: Table 1
    description: Logit analyses of determinants of civil war onset, 1945–99 (original Stata)
    parents: []
    engine: stata
    inputs:
      - data/repdata.dta
    data: data/repdata.dta
    code: code/tab_1.do
    stata_source: code/mkreptable1.do
    format: code/format_stata.R
    outputs:
      - outputs/staging/tab_1_stata.log
      - outputs/tab_1_stata.html
    artifact: outputs/tab_1_stata.html

  - id: tab_1_stata_format
    type: format
    label: Table 1 Stata format
    parent: tab_1_stata
    code: code/format_stata.R
